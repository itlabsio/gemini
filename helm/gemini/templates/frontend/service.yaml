apiVersion: v1
kind: Service
metadata:
  name: {{ include "gemini.fullname" . }}-frontend
  labels:
    {{- include "gemini.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gemini.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: http
