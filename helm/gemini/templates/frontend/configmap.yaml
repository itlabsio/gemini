apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gemini.fullname" . }}-frontend
  labels:
    {{- include "gemini.labels" . | nindent 4 }}
data:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_ENV: production
  KEYCLOAK_URL: {{ .Values.oidc.issuerUrl | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  # SPA обращается к backend по внутреннему DNS сервиса
  BACKEND_URL: {{ printf "http://%s-backend:%v" (include "gemini.fullname" .) .Values.service.backendPort | quote }}
  {{- if .Values.ingress.enabled }}
  AUTH_URL: {{ include "gemini.externalUrl" . | quote }}
  AUTH_TRUST_HOST: "true"
  ALLOWED_ORIGINS: {{ .Values.ingress.host | quote }}
  {{- end }}
