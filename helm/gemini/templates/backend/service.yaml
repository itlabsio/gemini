apiVersion: v1
kind: Service
metadata:
  name: {{ include "gemini.fullname" . }}-backend
  labels:
    {{- include "gemini.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gemini.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
