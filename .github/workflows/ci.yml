name: ci

# Тесты и линт. Запускается на push в main (коммиты идут прямо туда) и
# переиспользуется из release.yml (workflow_call) — там он гейтит сборку образов
# в pull request и по тегу, поэтому своего pull_request-триггера здесь нет.
#
# Backend-проверки — только при изменениях в backend/, frontend — в frontend/
# (job changes). all=true (тег, ручной запуск) — обе части безусловно.
on:
  push:
    branches: [main]
    paths: [backend/**, frontend/**, .github/workflows/ci.yml]
  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      all:
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # список файлов PR paths-filter берёт через API
    outputs:
      backend: ${{ inputs.all || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ inputs.all || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.all }}

      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ !inputs.all }}
        with:
          filters: |
            backend:
              - backend/**
              - .github/workflows/ci.yml
            frontend:
              - frontend/**
              - .github/workflows/ci.yml

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Живой Postgres для store-тестов: без TEST_PG_DSN они пропускаются.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gemini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gemini"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_PG_DSN: postgres://postgres:test@localhost:5432/gemini?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "не отформатировано gofmt:"; echo "$out"; exit 1; fi

      - run: go vet ./...

      # Схема для store-тестов — теми же миграциями, что и в проде (gemini migrate).
      - name: migrate test db
        env:
          POSTGRES_URL: ${{ env.TEST_PG_DSN }}
          OIDC_ISSUER_URL: http://ci.invalid
          OIDC_CLIENT_ID: ci
          SECRET_ENCRYPTION_KEY: "01234567890123456789012345678901"
        run: go run ./cmd/gemini migrate

      - run: go test -race ./...

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Версия — та же, что в frontend/Dockerfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bunx tsc --noEmit
