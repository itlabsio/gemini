name: release

# Публикация в ghcr.io — только по git-тегу vX.Y.Z:
#   образы ghcr.io/<repo>/{backend,frontend}:X.Y.Z
#   чарт   oci://ghcr.io/<repo>/charts/gemini  версии X.Y.Z (appVersion = X.Y.Z)
# В pull request образы только собираются, чарт только линтуется.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [backend/**, frontend/**, helm/**, .github/workflows/release.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      # Анонимные pull'ы с Docker Hub с раннеров GitHub упираются в rate limit (429).
      # Базовые образы тянем через публичный кэш Google; при промахе BuildKit сам
      # идёт на docker.io.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action сам приводит имя образа к нижнему регистру.
      # latest=auto: latest ставится только на semver-тег без pre-release (v1.2.3, не v1.2.3-rc.1).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  chart:
    # Чарт публикуется после образов, чтобы не ссылаться на несуществующий тег.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Lint
        run: |
          for f in helm/examples/values-*.yaml; do
            helm lint helm/gemini -f "$f"
            helm template gemini helm/gemini -f "$f" >/dev/null
          done

      - name: Package & push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package helm/gemini --version "$version" --app-version "$version" -d dist
          helm push "dist/gemini-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY,,}/charts"

  release:
    # GitHub Release — после публикации образов и чарта. --generate-notes видит
    # только смерженные PR, а коммиты идут прямо в main, поэтому сверху кладём
    # список коммитов от предыдущего тега, сгруппированный по conventional-типу.
    needs: chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          range="${prev:+$prev..}$tag"
          # section <заголовок> <флаги grep> <шаблон>: пустые секции не выводятся.
          section() {
            local lines
            lines=$(git log --no-merges --format='- %s (%h)' "$range" | grep "$2" "$3" || true)
            if [ -n "$lines" ]; then printf '### %s\n%s\n\n' "$1" "$lines"; fi
          }
          {
            section Features -E '^- feat(\(.*\))?!?:'
            section Fixes -E '^- fix(\(.*\))?!?:'
            section Other -vE '^- (feat|fix)(\(.*\))?!?:'
          } > notes.md
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          gh release create "$tag" --verify-tag --generate-notes --notes-file notes.md "${flags[@]}"
